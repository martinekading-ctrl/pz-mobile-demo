<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>PZ Mobile MVP - HTML Preview</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #wrap{position:fixed;inset:0;background:#171b17;touch-action:none}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  .hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
  .panel{background:rgba(14,18,14,.78);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.22);backdrop-filter:blur(8px)}
  .hpOuter{width:min(42vw,330px);height:14px;background:#302f2f;border-radius:999px;overflow:hidden;margin-top:6px}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#4be15b,#a5e34f)}
  .tiny{font-size:12px;opacity:.76;margin-top:4px}
  #inventory{margin-left:auto;text-align:right}
  .controls{position:absolute;inset:0;pointer-events:none}
  #joyBase{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(24px,calc(env(safe-area-inset-bottom) + 22px));width:138px;height:138px;border-radius:50%;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);pointer-events:auto}
  #joyKnob{position:absolute;left:39px;top:39px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:0 3px 18px rgba(0,0,0,.25)}
  .btn{position:absolute;border:0;color:#fff;border-radius:50%;font-weight:800;pointer-events:auto;touch-action:none;box-shadow:0 8px 22px rgba(0,0,0,.28)}
  #attack{right:max(24px,env(safe-area-inset-right));bottom:max(32px,calc(env(safe-area-inset-bottom) + 26px));width:92px;height:92px;background:rgba(190,58,48,.86);font-size:19px}
  #heal{right:max(126px,calc(env(safe-area-inset-right) + 112px));bottom:max(112px,calc(env(safe-area-inset-bottom) + 106px));width:68px;height:68px;background:rgba(48,135,76,.88);font-size:14px}
  #hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;opacity:.62;pointer-events:none;white-space:nowrap}
  #gameover{position:absolute;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;pointer-events:auto}
  #gameover .card{background:#171b17;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:28px;text-align:center;min-width:250px}
  #restart{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px}
  #portraitTip{display:none;position:fixed;inset:0;background:#111;z-index:30;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;line-height:1.7}
  @media (orientation:portrait){
    #portraitTip{display:flex}
    #wrap > *:not(#portraitTip){visibility:hidden}
  }
  @media (orientation:landscape){
    #portraitTip{display:none!important}
  }
  @media (max-height:520px){
    #joyBase{width:122px;height:122px}
    #joyKnob{left:35px;top:35px;width:52px;height:52px}
    #attack{width:82px;height:82px}
    #heal{width:60px;height:60px;right:max(118px,calc(env(safe-area-inset-right) + 104px));bottom:max(104px,calc(env(safe-area-inset-bottom) + 98px))}
    .hud{padding-top:calc(env(safe-area-inset-top) + 6px)}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="panel">
      <b>生命 <span id="hpText">100 / 100</span></b>
      <div class="hpOuter"><div id="hpBar"></div></div>
      <div class="tiny">PZ 手机版 · HTML 原型预览</div>
    </div>
    <div class="panel" id="inventory">废料 0　食物 0　药品 0<div class="tiny">靠近掉落物自动拾取</div></div>
  </div>

  <div class="controls">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button class="btn" id="attack">攻击</button>
    <button class="btn" id="heal">用药</button>
  </div>

  <div id="hint">手机：左摇杆移动 / 右侧攻击　电脑：WASD / 空格</div>

  <div id="gameover">
    <div class="card">
      <h2>你被感染者包围了</h2>
      <p>这只是第一版战斗原型。</p>
      <button id="restart">重新开始</button>
    </div>
  </div>

  <div id="portraitTip">请把手机旋转为横屏<br/>本预览仅支持横屏模式</div>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hpText = document.getElementById('hpText');
const hpBar = document.getElementById('hpBar');
const invEl = document.getElementById('inventory');
const gameoverEl = document.getElementById('gameover');

let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const world={w:2400,h:1600};
const player={x:1200,y:800,r:18,hp:100,maxHp:100,speed:190,damage:35,range:86,facing:{x:0,y:1},cooldown:0,inventory:{scrap:0,food:0,medicine:1},dead:false};
let zombies=[],loot=[],spawnT=0,attackFx=0,shake=0;
let last=performance.now();
const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==='Space'){e.preventDefault();attack();}
  if(e.key.toLowerCase()==='h') heal();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}

function spawnZombie(minD=350,maxD=720){
  let a=rnd(0,Math.PI*2), d=rnd(minD,maxD);
  let x=clamp(player.x+Math.cos(a)*d,60,world.w-60);
  let y=clamp(player.y+Math.sin(a)*d,60,world.h-60);
  zombies.push({x,y,r:17,hp:60,maxHp:60,speed:rnd(58,88),attackCd:rnd(0,.5),flash:0,dead:false});
}
for(let i=0;i<14;i++) spawnZombie();

function addLoot(x,y){
  let r=Math.random(), type='scrap';
  if(r>=.78 && r<.93) type='food';
  else if(r>=.93) type='medicine';
  loot.push({x,y,type,bob:Math.random()*6.28});
}

function attack(){
  if(player.dead || player.cooldown>0) return;
  player.cooldown=.42; attackFx=.12;
  let best=null,bestD=Infinity;
  for(const z of zombies){
    let dx=z.x-player.x,dy=z.y-player.y,d=Math.hypot(dx,dy);
    if(d>player.range) continue;
    let nx=dx/(d||1),ny=dy/(d||1);
    let front=player.facing.x*nx+player.facing.y*ny;
    if(front<-.15 && d>40) continue;
    if(d<bestD){bestD=d;best=z}
  }
  if(best){
    best.hp-=player.damage; best.flash=.08;
    let dx=best.x-player.x,dy=best.y-player.y,d=Math.hypot(dx,dy)||1;
    best.x+=dx/d*10; best.y+=dy/d*10;
    shake=6;
    if(best.hp<=0){best.dead=true;addLoot(best.x,best.y)}
  }
}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});

function heal(){
  if(player.dead || player.inventory.medicine<=0 || player.hp>=player.maxHp) return;
  player.inventory.medicine--; player.hp=Math.min(player.maxHp,player.hp+35); updateUI();
}
document.getElementById('heal').addEventListener('pointerdown',e=>{e.preventDefault();heal()});
document.getElementById('restart').onclick=()=>location.reload();

async function tryLockLandscape(){
  try{
    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');
    }
  }catch(e){}
}
document.addEventListener('pointerdown', tryLockLandscape, {once:true});

const joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob');
let joy={active:false,id:null,x:0,y:0};
function joyCenter(){
  const r=joyBase.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,rad:r.width*.34};
}
function setJoy(e){
  const c=joyCenter(),dx=e.clientX-c.x,dy=e.clientY-c.y,d=Math.hypot(dx,dy),m=Math.min(d,c.rad),nx=d?dx/d:0,ny=d?dy/d:0;
  joy.x=nx*(m/c.rad); joy.y=ny*(m/c.rad);
  joyKnob.style.transform=`translate(${joy.x*c.rad}px,${joy.y*c.rad}px)`;
}
joyBase.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joyBase.setPointerCapture(e.pointerId);setJoy(e)});
joyBase.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)setJoy(e)});
function joyEnd(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.x=joy.y=0;joyKnob.style.transform='translate(0,0)'}
joyBase.addEventListener('pointerup',joyEnd); joyBase.addEventListener('pointercancel',joyEnd);

function updateUI(){
  hpText.textContent=`${Math.ceil(player.hp)} / ${player.maxHp}`;
  hpBar.style.width=(player.hp/player.maxHp*100)+'%';
  invEl.innerHTML=`废料 ${player.inventory.scrap}　食物 ${player.inventory.food}　药品 ${player.inventory.medicine}<div class="tiny">靠近掉落物自动拾取</div>`;
}

function update(dt){
  if(player.dead)return;
  player.cooldown=Math.max(0,player.cooldown-dt);
  attackFx=Math.max(0,attackFx-dt); shake=Math.max(0,shake-dt*18);

  let mx=joy.x,my=joy.y;
  if(keys['w'])my-=1;if(keys['s'])my+=1;if(keys['a'])mx-=1;if(keys['d'])mx+=1;
  let ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;ml=1}
  if(ml>.05){
    player.facing.x=mx/(ml||1);player.facing.y=my/(ml||1);
    player.x=clamp(player.x+mx*player.speed*dt,30,world.w-30);
    player.y=clamp(player.y+my*player.speed*dt,30,world.h-30);
  }

  for(const z of zombies){
    z.attackCd-=dt; z.flash=Math.max(0,z.flash-dt);
    let dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy);
    if(d>34){
      z.x+=dx/(d||1)*z.speed*dt;z.y+=dy/(d||1)*z.speed*dt;
    }else if(z.attackCd<=0){
      z.attackCd=.95;player.hp=Math.max(0,player.hp-10);shake=8;updateUI();
      if(player.hp<=0){player.dead=true;gameoverEl.style.display='flex'}
    }
  }
  zombies=zombies.filter(z=>!z.dead);

  for(let i=loot.length-1;i>=0;i--){
    const l=loot[i];l.bob+=dt*3;
    if(dist(player.x,player.y,l.x,l.y)<42){
      player.inventory[l.type]=(player.inventory[l.type]||0)+1;
      loot.splice(i,1);updateUI();
    }
  }
  spawnT+=dt;
  if(spawnT>=5 && zombies.length<28){spawnT=0;spawnZombie(520,820)}
}

function isoDiamond(cx,cy,w,h,fill,stroke){
  ctx.beginPath();ctx.moveTo(cx,cy-h/2);ctx.lineTo(cx+w/2,cy);ctx.lineTo(cx,cy+h/2);ctx.lineTo(cx-w/2,cy);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function drawBuilding(x,y,w,h){
  const topY=y-h;
  ctx.fillStyle='#555c51';ctx.fillRect(x-w/2,topY,w,h);
  ctx.fillStyle='#747c6e';
  ctx.beginPath();ctx.moveTo(x-w/2,topY);ctx.lineTo(x,topY-28);ctx.lineTo(x+w/2,topY);ctx.lineTo(x,topY+28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2e342e';ctx.fillRect(x-13,y-38,26,38);
}
const buildings=[
  {x:1050,y:650,w:210,h:150},{x:1450,y:700,w:260,h:180},{x:900,y:1050,w:180,h:140},
  {x:1550,y:1100,w:220,h:155},{x:1250,y:1250,w:190,h:130}
];

function render(){
  ctx.clearRect(0,0,W,H);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  const camX=player.x-W/2+sx,camY=player.y-H/2+sy;
  ctx.save();ctx.translate(-camX,-camY);

  ctx.fillStyle='#283027';ctx.fillRect(0,0,world.w,world.h);

  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(170,190,164,.11)';
  for(let x=-world.h;x<world.w+world.h;x+=64){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+world.h,world.h);ctx.stroke();
  }
  for(let x=0;x<world.w+world.h;x+=64){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-world.h,world.h);ctx.stroke();
  }
  ctx.fillStyle='#343a33';ctx.fillRect(0,760,world.w,160);
  ctx.fillRect(1120,0,190,world.h);

  buildings.forEach(b=>drawBuilding(b.x,b.y,b.w,b.h));

  for(const l of loot){
    let yy=l.y+Math.sin(l.bob)*3;
    const colors={scrap:'#d8be6b',food:'#e88f54',medicine:'#67d890'};
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(l.x,l.y+8,12,5,0,0,6.28);ctx.fill();
    ctx.fillStyle=colors[l.type];ctx.beginPath();ctx.arc(l.x,yy,9,0,6.28);ctx.fill();
  }

  for(const z of zombies){
    ctx.fillStyle='rgba(0,0,0,.27)';ctx.beginPath();ctx.ellipse(z.x,z.y+13,18,7,0,0,6.28);ctx.fill();
    ctx.fillStyle=z.flash>0?'#ff6e62':'#6da14d';ctx.beginPath();ctx.arc(z.x,z.y,18,0,6.28);ctx.fill();
    ctx.fillStyle='#10140f';ctx.beginPath();ctx.arc(z.x-6,z.y-4,3,0,6.28);ctx.arc(z.x+6,z.y-4,3,0,6.28);ctx.fill();
    ctx.fillStyle='#251f1f';ctx.fillRect(z.x-18,z.y-31,36,4);
    ctx.fillStyle='#df433d';ctx.fillRect(z.x-18,z.y-31,36*Math.max(0,z.hp/z.maxHp),4);
  }

  if(attackFx>0){
    let ang=Math.atan2(player.facing.y,player.facing.x);
    ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.arc(player.x,player.y,player.range,ang-.65,ang+.65);ctx.closePath();
    ctx.fillStyle='rgba(255,214,72,.18)';ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(player.x,player.y+14,20,8,0,0,6.28);ctx.fill();
  ctx.fillStyle='#2cb7e8';ctx.beginPath();ctx.arc(player.x,player.y,19,0,6.28);ctx.fill();
  ctx.fillStyle='#185c78';ctx.beginPath();ctx.arc(player.x,player.y-4,12,0,6.28);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+player.facing.x*32,player.y+player.facing.y*32);ctx.stroke();
  ctx.fillStyle='#202020';ctx.fillRect(player.x-25,player.y-39,50,6);
  ctx.fillStyle='#45e65b';ctx.fillRect(player.x-25,player.y-39,50*(player.hp/player.maxHp),6);

  ctx.strokeStyle='rgba(190,210,185,.35)';ctx.lineWidth=5;ctx.strokeRect(0,0,world.w,world.h);
  ctx.restore();

  requestAnimationFrame(loop);
}
function loop(t){
  let dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt);render();
}
updateUI();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
